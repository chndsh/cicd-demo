# Workflow name — shows up in GitHub Actions tab
name: CI

# When does this run?
on:
  push:
    branches: [main]       # on every push to main
  pull_request:
    branches: [main]       # on every PR targeting main

# Global permissions — deny everything by default
# Each job below only gets what it explicitly asks for
permissions: {}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest   # GitHub-hosted runner (free)

    # This job only needs to read the repo
    permissions:
      contents: read

    steps:
      # Step 1: Check out your code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (matches your local version)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'       # cache node_modules between runs

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install --omit=dev

      # Step 4: Set up Docker Buildx (needed for multi-platform builds later)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build the Docker image (don't push yet — just verify it builds)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false        # build only, no push
          tags: cicd-demo:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6: Start the container and run the health check test
      - name: Run container and test
        run: |
          docker run -d \
            --name cicd-demo-test \
            -p 3000:3000 \
            -e APP_ENV=ci \
            cicd-demo:test

          # Wait for it to be ready (up to 15 seconds)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "✅ App is up"
              break
            fi
            echo "Waiting... ($i)"
            sleep 1
          done

          # Run the test script
          node src/test.js

      # Step 7: Always clean up the container, even if tests fail
      - name: Cleanup
        if: always()
        run: docker stop cicd-demo-test && docker rm cicd-demo-test || true
