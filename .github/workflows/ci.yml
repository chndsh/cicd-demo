name: CI / CD

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # ── Job 1: Test ────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cicd-demo:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and test
        run: |
          docker run -d \
            --name cicd-demo-test \
            -p 3000:3000 \
            -e APP_ENV=ci \
            cicd-demo:test

          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/health; then
              echo "✅ App is up"
              break
            fi
            echo "Waiting... ($i)"
            sleep 1
          done
          node src/test.js

      - name: Cleanup
        if: always()
        run: docker stop cicd-demo-test && docker rm cicd-demo-test || true

  # ── Job 2: Vulnerability Scan ──────────────────────────────
  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cicd-demo:scan
          load: true
          # Pulls from the cache created in the 'test' job
          cache-from: type=gha

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cicd-demo:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1' # This will fail the CI if vulnerabilities are found

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Upload results even if the scan failed (code 1)
        with:
          sarif_file: trivy-results.sarif

  # ── Job 3: Push (Only runs if Scan & Test pass) ───────────
  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [test, scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cicd-demo
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR (OIDC)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless via OIDC)
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/cicd-demo@${DIGEST}

      - name: Summary
        run: |
          echo "### 📦 Pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`ghcr.io/${{ github.repository_owner }}/cicd-demo\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY